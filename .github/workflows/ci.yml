name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  probe-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The probe image is the unit of work the whole product dispatches. If it stops
      # building, every hunt fails at the same place, so it is gated here rather than
      # discovered at dispatch time.
      - name: Build the probe image
        run: docker build -t faultline/probe:ci probe/
