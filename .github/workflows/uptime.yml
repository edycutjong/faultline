# The demo must stay live, free and unrestricted through 2026-12-15 — 46 days after
# submission. Projects lose events by going dark during judging, so this runs unattended
# and does not depend on anyone remembering to check.
#
# It alarms on SILENCE as well as on events: a workflow that only opens issues when a probe
# fails cannot tell you it stopped running.

name: Uptime

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the live URL
        id: check
        env:
          BASE_URL: ${{ vars.FAULTLINE_BASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "FAULTLINE_BASE_URL repository variable is not set." >&2
            exit 1
          fi

          fail=0

          # The landing page and the recorded example are the two paths a judge actually
          # takes. Both must answer without credentials.
          for path in "/" "/api/examples/recorded" "/api/integrations/verify"; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 "${BASE_URL}${path}" || echo 000)
            echo "${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned ${code}"
              fail=1
            fi
          done

          exit $fail

      - name: Open an issue when the demo is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Uptime check failed";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });
            const body = `The scheduled uptime probe failed at ${new Date().toISOString()}.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["uptime"],
              });
            }

  heartbeat:
    # Alarms on silence: this job records that the workflow ran at all. If these stop
    # appearing, the schedule itself has broken -- the failure mode a failure-only alarm
    # cannot see.
    runs-on: ubuntu-latest
    steps:
      - name: Record a heartbeat
        run: echo "uptime workflow ran at $(date -u +%FT%TZ)"
