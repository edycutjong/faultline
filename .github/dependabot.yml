version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps are framework migrations, not maintenance. On a project that must stay
      # live and working for judges through 2026-12-15, an unattended next 15 -> 16 is a way
      # to wake up to a broken demo. Security alerts stay on; they are a separate feature.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Same rule as npm, and it is not theoretical: the first run of this config opened a PR
      # taking actions/checkout and actions/setup-node from v4 to v7 in one jump. A major
      # action bump changes runner behaviour and can take the whole pipeline down on a project
      # whose demo has to stay up through judging.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/probe"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      # The probe image's Python version is PRODUCT BEHAVIOUR, not a dependency: it decides
      # which repositories' test suites the container can actually run. The first run proposed
      # 3.11 -> 3.14, which would silently change what a hunt is capable of testing. That is a
      # deliberate decision with a benchmark behind it, never an unattended bump.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
